name: Deploy to Cloudflare Pages (RETIRED)

# ⚠️ 已退役（ADR 0018 Phase 3）。本站（VitePress）已被新的 aster-dev（Next.js）
# 替换，aster-lang.dev 自定义域名现绑在 Cloudflare Worker `aster-dev` 上。
#
# 自动 push 触发已移除——否则 push main 会重新 `pages deploy` 并把 aster-lang.dev
# 域名从新 Worker 抢回旧 Pages 项目，回退 cutover。
#
# 仅保留 workflow_dispatch（手动）作为应急回退手段：若新站故障需临时回退到旧 Pages
# 站，手动触发本 workflow + 在 CF dashboard 把域名绑回 Pages 项目即可。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        # version is read from package.json's "packageManager"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm docs:build

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # CF API rejects non-ASCII characters in commit messages
          # (returns "Invalid commit message, it must be a valid UTF-8
          # string. [code: 8000111]" — empirically blocked on smart
          # quotes, em-dashes, and arrows that are legal UTF-8 but
          # filtered by the deployment metadata pipeline). Override
          # with an ASCII summary derived from GITHUB_SHA so the
          # deployment never depends on commit-message contents.
          command: pages deploy docs/.vitepress/dist --project-name aster-lang-dev --branch main --commit-hash=${{ github.sha }} --commit-message="deploy ${{ github.sha }}" --commit-dirty=true
